# Skylark frontend: serves the SPA and proxies API/admin/docs/ws to the
# daphne backend. This also shadows the legacy Django template pages (/, /projects/<slug>/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;  # room for event payloads / sourcemap uploads

    # Re-resolve the backend via Docker's embedded DNS so a recreated skylark-api
    # (new IP) is picked up within 10s instead of 502-ing on a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { set $api skylark-api:8000; proxy_pass http://$api; }
    location /admin/  { set $api skylark-api:8000; proxy_pass http://$api; }
    location /docs    { set $api skylark-api:8000; proxy_pass http://$api; }
    location /static/ { set $api skylark-api:8000; proxy_pass http://$api; }

    location /ws/ {
        set $api skylark-api:8000;
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Remote MCP endpoint (Streamable-HTTP) — clients add https://skylark.halfagiraf.com/mcp
    # + a Bearer token, no clone/install. Streaming-friendly: no buffering, long reads.
    location /mcp {
        set $mcp skylark-mcp:3000;
        proxy_pass http://$mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # SPA: everything else falls back to index.html so client routes
    # (e.g. /invite/<token>) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
